[package]
name = "tihulu-cosmic-minimized-windows"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-only"
description = "A stability-focused minimized windows applet for the COSMIC desktop."
repository = "https://github.com/Tihulu/tihulu-cosmic-minimized-windows"

[dependencies]
cctk = { git = "https://github.com/pop-os/cosmic-protocols", package = "cosmic-client-toolkit", rev = "32283d7" }
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols", default-features = false, features = ["client"], rev = "32283d7" }
futures = "0.3"
image = { version = "0.25", default-features = false }
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "ef490df50b0a05a21c494c3f75737581bf0b39d9", default-features = false, features = ["applet", "applet-token", "dbus-config", "multi-window", "tokio", "wayland", "desktop-systemd-scope", "winit"] }
rustix = { version = "1", features = ["fs"] }
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
