name: Apply media scrubber

on:
  push:
    branches: [feat/media-seek-scrubber]
    paths:
      - '.github/patch-media-scrubber.py'
      - '.github/workflows/apply-media-scrubber.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/media-seek-scrubber
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply patch
        run: python3 .github/patch-media-scrubber.py
      - name: Format
        run: cargo fmt --all
      - name: Remove temporary patcher
        run: rm .github/patch-media-scrubber.py .github/workflows/apply-media-scrubber.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.rs src/media_client.rs .github
          git commit -m 'feat: add draggable media seek scrubber'
          git push origin HEAD:feat/media-seek-scrubber
