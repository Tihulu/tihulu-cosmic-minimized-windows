name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake libegl1-mesa-dev libexpat1-dev libfontconfig-dev \
            libfreetype-dev libwayland-dev libxkbcommon-dev pkgconf
      - name: Shell syntax
        run: find scripts -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 -r bash -n
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Check
        shell: bash
        run: |
          set -o pipefail
          cargo check --all-targets --message-format=short 2>&1 | tee check.log
      - name: Upload Check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-log
          path: check.log
          if-no-files-found: ignore
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log
      - name: Upload Clippy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-log
          path: clippy.log
          if-no-files-found: ignore

  promote-stable:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: rust
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote verified main to stable
        run: |
          git fetch origin main stable
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [ "$CURRENT_MAIN" != "$GITHUB_SHA" ]; then
            echo "A newer main commit exists; skipping stable promotion."
            exit 0
          fi
          git push origin "${GITHUB_SHA}:refs/heads/stable"
