name: Patch media progress tick

on:
  push:
    branches:
      - fix/media-progress-tick

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/media-progress-tick
      - name: Apply focused media progress patch
        run: |
          python3 .github/patch_media_progress.py
          rm .github/patch_media_progress.py .github/workflows/patch-media-progress.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.rs .github/patch_media_progress.py .github/workflows/patch-media-progress.yml
          git commit -m "fix: interpolate media progress every second"
          git push origin HEAD:fix/media-progress-tick
