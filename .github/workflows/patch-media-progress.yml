name: Patch media progress tick

on:
  push:
    branches:
      - fix/media-progress-tick

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/media-progress-tick
      - name: Apply focused media progress patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/patch_media_progress.py')
          text = path.read_text()
          old = '''for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match, got {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)
          '''
          new = '''clear_pattern = "                    self.media_players.clear();\\n                    self.media_seek_drafts.clear();\\n"
          for old, new in replacements:
              count = text.count(old)
              expected = 2 if old == clear_pattern else 1
              if count == 0 and "self.persist_settings();" in old and "self.media_players.clear();" in old:
                  continue
              if count != expected:
                  raise SystemExit(f"expected {expected} match(es), got {count}: {old[:100]!r}")
              text = text.replace(old, new, expected)
          '''
          if old not in text:
              raise SystemExit('patch loop not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 .github/patch_media_progress.py
          rm .github/patch_media_progress.py .github/workflows/patch-media-progress.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.rs .github/patch_media_progress.py .github/workflows/patch-media-progress.yml
          git commit -m "fix: interpolate media progress every second"
          git push origin HEAD:fix/media-progress-tick
