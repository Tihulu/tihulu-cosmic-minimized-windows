name: Patch browser volume compatibility retry

on:
  push:
    branches:
      - fix/browser-media-volume

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/browser-media-volume
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake libegl1-mesa-dev libexpat1-dev libfontconfig-dev \
            libfreetype-dev libwayland-dev libxkbcommon-dev pkgconf
      - name: Reuse staged patch safely
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/patch-browser-volume.yml').read_text()
          start_marker = "      - name: Apply browser volume patch\n        shell: python\n        run: |\n"
          end_marker = "      - name: Format\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          block = workflow[start:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          patch = '\n'.join(lines) + '\n'
          Path('/tmp/patch-browser-volume.py').write_text(patch)
          subprocess.run(['python', '/tmp/patch-browser-volume.py'], check=True)
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Remove temporary workflows
        run: rm .github/workflows/patch-browser-volume.yml .github/workflows/patch-browser-volume-retry.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/bin/tihulu-mediad/main.rs .github/workflows/patch-browser-volume.yml .github/workflows/patch-browser-volume-retry.yml
          git commit -m "fix: control browser media volume via app stream"
          git push origin HEAD:fix/browser-media-volume
