name: v0.5 one-shot maintenance

on:
  push:
    branches:
      - v0.5-safe-switch-daemons

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-safe-switch-daemons
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fix probe proc scan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/bin/tihulu-preview-probe.rs')
          s = p.read_text()
          old = '''fn pid_by_comm(name: &str) -> Option<u32> {
    for entry in fs::read_dir("/proc").ok()? {
        let entry = entry.ok()?;
        let pid = entry.file_name().to_string_lossy().parse::<u32>().ok()?;
        let comm = fs::read_to_string(format!("/proc/{pid}/comm")).ok()?;
        if comm.trim() == name {
            return Some(pid);
        }
    }
    None
}
'''
          new = '''fn pid_by_comm(name: &str) -> Option<u32> {
    let entries = fs::read_dir("/proc").ok()?;
    for entry in entries {
        let Ok(entry) = entry else {
            continue;
        };
        let Ok(pid) = entry.file_name().to_string_lossy().parse::<u32>() else {
            continue;
        };
        let Ok(comm) = fs::read_to_string(format!("/proc/{pid}/comm")) else {
            continue;
        };
        if comm.trim() == name {
            return Some(pid);
        }
    }
    None
}
'''
          if old not in s:
              raise SystemExit('expected pid_by_comm source not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Rustfmt
        run: cargo fmt --all
      - name: Commit maintenance output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git commit -m "Apply rustfmt and harden probe proc scan"
          git push origin HEAD:v0.5-safe-switch-daemons
