name: v0.5 one-shot maintenance

on:
  push:
    branches:
      - v0.5-safe-switch-daemons

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5-safe-switch-daemons
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Harden probe proc scan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/bin/tihulu-preview-probe.rs")
          s = p.read_text()
          start = s.index("fn pid_by_comm(name: &str) -> Option<u32> {")
          end = s.index("\nfn proc_metrics", start)
          replacement = """fn pid_by_comm(name: &str) -> Option<u32> {
              let entries = fs::read_dir(\"/proc\").ok()?;
              for entry in entries {
                  let Ok(entry) = entry else {
                      continue;
                  };
                  let Ok(pid) = entry.file_name().to_string_lossy().parse::<u32>() else {
                      continue;
                  };
                  let Ok(comm) = fs::read_to_string(format!(\"/proc/{pid}/comm\")) else {
                      continue;
                  };
                  if comm.trim() == name {
                      return Some(pid);
                  }
              }
              None
          }
          """
          p.write_text(s[:start] + replacement + s[end + 1:])
          PY
      - name: Rustfmt
        run: cargo fmt --all
      - name: Commit source maintenance
        run: |
          if git diff --quiet -- src; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git commit -m "Apply rustfmt and harden probe proc scan"
          git push origin HEAD:v0.5-safe-switch-daemons
