name: Fix media seek compatibility

on:
  push:
    branches:
      - feat/media-seek-scrubber
    paths:
      - .github/workflows/fix-media-seek-compat.yml
      - .github/scripts/fix_media_seek_compat.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/media-seek-scrubber
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply compatibility patch
        run: python3 .github/scripts/fix_media_seek_compat.py
      - name: Format
        run: cargo fmt --all
      - name: Remove temporary patcher
        run: rm -f .github/workflows/fix-media-seek-compat.yml .github/scripts/fix_media_seek_compat.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: resolve current MPRIS track for seek"
          git push origin HEAD:feat/media-seek-scrubber
