name: Format v0.3.2

on:
  push:
    branches:
      - v0.3.2-popup-hover-browser-audio

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.3.2-popup-hover-browser-audio
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.rs src/media.rs Cargo.toml
          git commit -m 'Apply rustfmt for v0.3.2'
          git push origin HEAD:v0.3.2-popup-hover-browser-audio
