name: Refine browser volume matching

on:
  push:
    branches: [fix/browser-media-volume]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/browser-media-volume
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libegl1-mesa-dev libexpat1-dev libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev pkgconf
      - name: Refine browser identity matching
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/bin/tihulu-mediad/main.rs')
          s = p.read_text()
          old = '''fn browser_volume_aliases(identity: &str, bus_name: &str) -> Vec<&'static str> {
              let haystack = normalize(&format!("{identity}{bus_name}"));
              const BROWSERS: &[(&str, &str)] = &[
                  ("brave", "brave"),
                  ("firefox", "firefox"),
                  ("chromium", "chromium"),
                  ("googlechrome", "chrome"),
                  ("chrome", "chrome"),
                  ("vivaldi", "vivaldi"),
                  ("opera", "opera"),
                  ("microsoftedge", "edge"),
                  ("msedge", "edge"),
              ];
              let mut aliases = Vec::new();
              for (needle, alias) in BROWSERS {
                  if haystack.contains(needle) && !aliases.contains(alias) {
                      aliases.push(*alias);
                  }
              }
              aliases
          }'''
          new = '''fn browser_volume_aliases(identity: &str, bus_name: &str) -> Vec<&'static str> {
              const BROWSERS: &[(&str, &str)] = &[
                  ("brave", "brave"),
                  ("firefox", "firefox"),
                  ("googlechrome", "chrome"),
                  ("chrome", "chrome"),
                  ("vivaldi", "vivaldi"),
                  ("opera", "opera"),
                  ("microsoftedge", "edge"),
                  ("msedge", "edge"),
                  ("chromium", "chromium"),
              ];

              let identity = normalize(identity);
              if let Some((_, alias)) = BROWSERS
                  .iter()
                  .find(|(needle, _)| identity.contains(needle))
              {
                  return vec![*alias];
              }

              let bus_name = normalize(bus_name);
              BROWSERS
                  .iter()
                  .find(|(needle, _)| bus_name.contains(needle))
                  .map(|(_, alias)| vec![*alias])
                  .unwrap_or_default()
          }'''
          if s.count(old) != 1:
              raise SystemExit('browser_volume_aliases block mismatch')
          s = s.replace(old, new, 1)
          s = s.replace('''        assert!(aliases.contains(&"brave"));
                  assert!(aliases.contains(&"chromium"));''', '''        assert_eq!(aliases, vec!["brave"]);''', 1)
          p.write_text(s)
      - name: Validate
        run: |
          cargo fmt --all
          cargo check --all-targets
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
      - name: Self-delete and commit
        run: |
          rm .github/workflows/refine-browser-volume-match.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/bin/tihulu-mediad/main.rs .github/workflows/refine-browser-volume-match.yml
          git commit -m "fix: scope browser volume to player identity"
          git push origin HEAD:fix/browser-media-volume
